# =============================================================================
# PostgreSQL integration-test profile (profile name: postgres-it).
#
# Used ONLY by the opt-in PostgreSQL smoke test. It connects to the real local
# PostgreSQL development database using the same environment-variable
# credentials as the local runtime profile. It is deliberately isolated from
# the default H2-based test profile so that the normal `mvn clean test` never
# depends on a developer's PostgreSQL password or installation.
#
# Required environment variables:
#   HRMS_DB_USERNAME   e.g. hrms_app
#   HRMS_DB_PASSWORD   the local password for hrms_app
# Optional override:
#   HRMS_DB_URL        default jdbc:postgresql://localhost:5432/hrms
# =============================================================================
spring.datasource.url=${HRMS_DB_URL:jdbc:postgresql://localhost:5432/hrms}
spring.datasource.username=${HRMS_DB_USERNAME}
spring.datasource.password=${HRMS_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
logging.level.org.flywaydb=INFO
