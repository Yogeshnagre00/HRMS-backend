# =============================================================================
# Test profile.
# Uses an in-memory H2 database in PostgreSQL compatibility mode so the suite
# runs from a clean checkout without a live PostgreSQL server, while still
# exercising the Flyway migration mechanism end-to-end.
# =============================================================================
spring.datasource.url=jdbc:h2:mem:hrms;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

logging.level.org.flywaydb=INFO
