# =============================================================================
# Local development profile (PostgreSQL).
#
# Connects to the local PostgreSQL 17 development database:
#   jdbc:postgresql://localhost:5432/hrms
#
# Credentials are supplied ONLY through environment variables and are never
# committed. The application connects as the dedicated application role
# (hrms_app), never as the PostgreSQL superuser.
#
# Required environment variables:
#   HRMS_DB_USERNAME   e.g. hrms_app
#   HRMS_DB_PASSWORD   the local password for hrms_app
#
# There are intentionally NO default values for username/password so a missing
# environment variable fails fast instead of silently using a committed secret.
# The JDBC URL may be overridden with HRMS_DB_URL if needed.
# =============================================================================
spring.datasource.url=${HRMS_DB_URL:jdbc:postgresql://localhost:5432/hrms}
spring.datasource.username=${HRMS_DB_USERNAME}
spring.datasource.password=${HRMS_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway runs the committed migrations (V1, V2) against the local database.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Show migration and web details while developing locally.
logging.level.org.flywaydb=INFO
management.endpoint.health.show-details=always

# --- OpenAPI / Swagger UI (local development) ------------------------------
# springdoc exposes the OpenAPI JSON and Swagger UI. Paths are explicit so they
# are stable and easy to verify.
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
