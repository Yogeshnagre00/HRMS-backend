# =============================================================================
# Production profile.
# All connection values are supplied by the environment; there are no committed
# credentials. Flyway validates that the schema matches the migration history
# and never baselines automatically in production.
# =============================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# Do not expose health details publicly in production.
management.endpoint.health.show-details=never

logging.level.root=INFO
