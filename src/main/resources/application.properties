# =============================================================================
# HRMS Payroll MVP - base application configuration (V0-001 foundation)
# Profile-specific values live in application-{local,test,prod}.properties.
# The active profile defaults to "local" for developer machines and can be
# overridden with SPRING_PROFILES_ACTIVE.
# =============================================================================
spring.application.name=HRMS
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# --- Database migration mechanism (Flyway) ---------------------------------
# Migrations are the only mechanism allowed to change the schema. Business
# tables are added by later tasks; V0-001 only proves the mechanism works.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- JPA / Hibernate --------------------------------------------------------
# Flyway owns the schema; Hibernate must never create or alter it. It only
# validates that entities map to the Flyway-managed tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- JWT authentication (V0-003) -------------------------------------------
# The signing secret MUST be supplied via the environment in real deployments
# and never committed. A development-only fallback is provided so local/test
# runs work out of the box; override with HRMS_JWT_SECRET in any real setting.
hrms.security.jwt.secret=${HRMS_JWT_SECRET:dev-only-insecure-secret-change-me-0123456789-0123456789}
hrms.security.jwt.access-token-minutes=60
hrms.security.jwt.mfa-challenge-minutes=5
hrms.security.jwt.refresh-token-minutes=10080

# --- Initial Super Admin bootstrap (V0-003 correction) ---------------------
# On startup, if the bootstrap username does not exist, a PLATFORM SUPER_ADMIN
# is created in app_user with a hashed password and flagged to change it after
# first login. Credentials are supplied ONLY via the environment; there is NO
# committed default password. If HRMS_BOOTSTRAP_ADMIN_PASSWORD is absent, the
# bootstrap is skipped (no user is created with a guessed/hardcoded password).
hrms.security.bootstrap.enabled=${HRMS_BOOTSTRAP_ENABLED:true}
hrms.security.bootstrap.username=${HRMS_BOOTSTRAP_ADMIN_USERNAME:admin}
hrms.security.bootstrap.password=${HRMS_BOOTSTRAP_ADMIN_PASSWORD:}
hrms.security.bootstrap.email=${HRMS_BOOTSTRAP_ADMIN_EMAIL:admin@example.com}

# Note: Spring Boot's default in-memory security user is disabled by excluding
# UserDetailsServiceAutoConfiguration on the @SpringBootApplication class, so no
# startup-generated password is produced. Authentication is against app_user.

# --- Actuator health / readiness foundation --------------------------------
# Expose health only; enable liveness/readiness probe groups for orchestration.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# --- API error contract -----------------------------------------------------
# Do not leak stack traces/messages through the default error attributes;
# the GlobalExceptionHandler owns the client-facing error shape.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
